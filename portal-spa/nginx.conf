server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Security headers
    add_header X-Frame-Options           DENY;
    add_header X-Content-Type-Options    nosniff;
    add_header X-XSS-Protection          "1; mode=block";
    add_header Referrer-Policy           strict-origin-when-cross-origin;
    add_header Content-Security-Policy   "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:;";

    # SPA fallback — all non-asset routes serve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy: vendor auth + enrollment → auth-service:8001
    location /auth/ {
        proxy_pass         http://auth-service:8001;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_read_timeout 30s;
    }

    location /enroll {
        proxy_pass       http://auth-service:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Proxy: admin auth + admin management → auth-service:8001
    location /admin/auth/ {
        proxy_pass       http://auth-service:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location ~ ^/admin/(vendors|devices|enrollment-links|sessions|audit|dashboard) {
        proxy_pass       http://auth-service:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 60s;
    }

    # Proxy: file ops + log analyser + LLM → backend-api:8002
    location /upload/ {
        proxy_pass            http://backend-api:8002;
        proxy_set_header      Host $host;
        proxy_set_header      X-Real-IP $remote_addr;
        client_max_body_size  550M;
        proxy_read_timeout    120s;
        proxy_request_buffering off;
    }

    location /operations/ {
        proxy_pass         http://backend-api:8002;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_read_timeout 150s;
    }

    location /portal/ {
        proxy_pass       http://backend-api:8002;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /admin/logs/ {
        proxy_pass             http://backend-api:8002;
        proxy_set_header       Host $host;
        proxy_set_header       X-Real-IP $remote_addr;
        proxy_read_timeout     300s;
        proxy_buffering        off;          # required for SSE streaming
        proxy_cache            off;
        proxy_set_header       X-Accel-Buffering no;
        chunked_transfer_encoding on;
    }

    location /admin/llm/ {
        proxy_pass             http://backend-api:8002;
        proxy_set_header       Host $host;
        proxy_set_header       X-Real-IP $remote_addr;
        proxy_read_timeout     60s;
        proxy_buffering        off;
        proxy_cache            off;
        proxy_set_header       X-Accel-Buffering no;
    }

    location /admin/extensions {
        proxy_pass       http://backend-api:8002;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Block direct access to internal health endpoints
    location ~ ^/(health|docs|openapi\.json|redoc) {
        return 404;
    }

    # Cache static assets aggressively
    location ~* \.(js|css|png|svg|ico|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
